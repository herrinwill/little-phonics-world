<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Little Phonics World</title>
<meta name="description" content="A joyful picture-first phonics game for little learners: Hebrew, Greek, Thai and Spanish.">
<meta name="theme-color" content="#7c5cff">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M50 6l13 28 30 3-23 20 7 30-27-16-27 16 7-30-23-20 30-3z' fill='%23ffc928'/%3E%3C/svg%3E">
<style>
/* ===== Little Phonics World — base & shell ===== */
:root{
  --sky1:#bfe9ff; --sky2:#ffe6fa; --ink:#2b2350; --card:#ffffff;
  --red:#ff5a5f; --orange:#ff9f1c; --yellow:#ffd23f; --green:#3ddc84;
  --teal:#2ec4b6; --blue:#4d96ff; --purple:#9b5de5; --pink:#ff7eb6;
  --shadow:0 6px 0 rgba(43,35,80,.18), 0 10px 24px rgba(43,35,80,.12);
  --radius:26px; --tap:64px;
  --font:"Nunito","Noto Sans","Noto Sans Hebrew","Noto Sans Thai","Noto Sans Greek","Segoe UI","Leelawadee UI","Leelawadee","Thonburi","Arial Hebrew",Tahoma,Arial,"Helvetica Neue",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden}
body{
  font-family:var(--font); color:var(--ink); min-height:100vh; min-height:100dvh;
  background:linear-gradient(180deg,var(--sky1) 0%,#dff6ff 45%,var(--sky2) 100%) fixed;
  -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none;
  touch-action:manipulation;
}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:5px solid var(--purple);outline-offset:3px}
svg{display:block}
[dir=rtl]{unicode-bidi:isolate}

/* ---- top bar ---- */
#topbar{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;
  padding:10px max(12px,env(safe-area-inset-left));
  background:rgba(255,255,255,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  box-shadow:0 3px 14px rgba(43,35,80,.12);flex-wrap:nowrap;
}
.iconbtn{
  width:var(--tap);height:var(--tap);min-width:var(--tap);border-radius:22px;background:#fff;
  box-shadow:var(--shadow);display:grid;place-items:center;transition:transform .15s;
}
.iconbtn:active{transform:translateY(3px) scale(.96)}
.iconbtn svg{width:44px;height:44px}
#homeBtn{background:var(--yellow)}
#parentBtn[aria-pressed=true]{background:var(--green)}
#langbar{flex:1;display:flex;gap:8px;justify-content:center;min-width:0}
.pill{
  min-height:var(--tap);min-width:var(--tap);padding:6px 14px 6px 6px;border-radius:40px;background:#fff;
  display:flex;align-items:center;gap:8px;box-shadow:var(--shadow);transition:transform .15s,background .2s;
  font-weight:800;font-size:18px;white-space:nowrap;
}
.pill .glyph{
  width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:30px;font-weight:900;
  color:#fff;flex:none;text-shadow:0 2px 0 rgba(0,0,0,.18);
}
.pill.on{transform:scale(1.06);box-shadow:0 0 0 5px #fff,0 0 0 9px var(--c,#9b5de5),var(--shadow)}
.pill:active{transform:scale(.95)}
.starcount{
  min-height:var(--tap);padding:0 14px 0 8px;border-radius:40px;background:#fff;box-shadow:var(--shadow);
  display:flex;align-items:center;gap:4px;font-weight:900;font-size:26px;flex:none;
}
.starcount svg{width:44px;height:44px}
.starcount.bump{animation:bump .5s}

/* ---- screens ---- */
#screen{padding:16px max(14px,env(safe-area-inset-left)) 40px;max-width:1200px;margin:0 auto}
.screen-title{display:flex;align-items:center;justify-content:center;gap:12px;margin:4px 0 14px}
.screen-title .ico{width:64px;height:64px}
.screen-title h1{margin:0;font-size:clamp(20px,3.2vw,30px);font-weight:900;letter-spacing:.5px}
.parent{display:none}
body.parent-on .parent{display:block}
body.parent-on span.parent{display:inline}
.ptxt{font-size:15px;font-weight:700;color:#5a4f8a;background:#fff8d6;border-radius:12px;padding:3px 9px;margin-top:4px}

/* ---- home ---- */
.home-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(12px,2.4vw,24px)}
.mode-btn{
  position:relative;border-radius:34px;min-height:clamp(150px,26vh,240px);box-shadow:var(--shadow);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:12px;
  overflow:hidden;transition:transform .15s;color:#fff;
}
.mode-btn:active{transform:scale(.97)}
.mode-btn svg{width:clamp(96px,16vw,170px);height:auto;filter:drop-shadow(0 6px 0 rgba(0,0,0,.12));animation:floaty 3.2s ease-in-out infinite}
.mode-btn:nth-child(2) svg{animation-delay:-.8s}.mode-btn:nth-child(3) svg{animation-delay:-1.6s}.mode-btn:nth-child(4) svg{animation-delay:-2.4s}
.mode-btn .lbl{font-size:clamp(14px,2vw,20px);font-weight:900;text-shadow:0 2px 0 rgba(0,0,0,.2);text-align:center}
.mode-btn::after{content:"";position:absolute;inset:auto -30% -60% -30%;height:70%;background:rgba(255,255,255,.18);border-radius:50%}
.m-letters{background:linear-gradient(160deg,#ff8a5b,#ff5a8a)}
.m-builder{background:linear-gradient(160deg,#5ad1ff,#4d6bff)}
.m-bubbles{background:linear-gradient(160deg,#3ddc84,#16a7a0)}
.m-stage{background:linear-gradient(160deg,#b06bff,#ff6bd6)}
.sticker-btn{
  margin:clamp(12px,2.4vw,24px) auto 0;display:flex;align-items:center;gap:14px;justify-content:center;
  min-height:96px;padding:10px 26px;border-radius:50px;background:var(--yellow);box-shadow:var(--shadow);
  font-weight:900;font-size:clamp(16px,2.2vw,22px);width:min(560px,100%);
}
.sticker-btn svg{width:78px;height:78px}
.hello{text-align:center;margin:0 0 14px}
.hello .big{font-size:clamp(30px,6vw,56px);font-weight:900;line-height:1.1;color:#fff;text-shadow:0 4px 0 var(--purple),0 8px 14px rgba(43,35,80,.25)}

/* ---- big round action buttons ---- */
.roundbtn{
  width:clamp(72px,12vw,96px);height:clamp(72px,12vw,96px);border-radius:50%;background:#fff;box-shadow:var(--shadow);
  display:grid;place-items:center;transition:transform .15s;flex:none;
}
.roundbtn svg{width:62%;height:62%}
.roundbtn:active{transform:scale(.92)}
.roundbtn.go{background:var(--green)}
.roundbtn.speak{background:var(--yellow)}

/* ---- sound-out badge ---- */
.badge{
  position:fixed;left:50%;bottom:24px;transform:translate(-50%,160%);z-index:60;pointer-events:none;
  background:#fff;border-radius:40px;padding:12px 26px 12px 14px;display:flex;align-items:center;gap:12px;
  box-shadow:0 0 0 6px var(--yellow),var(--shadow);font-weight:900;font-size:clamp(22px,4vw,34px);
  transition:transform .35s cubic-bezier(.3,1.6,.5,1);max-width:94vw;
}
.badge.show{transform:translate(-50%,0);animation:badgeBounce .9s ease-in-out infinite alternate}
.badge svg{width:54px;height:54px;flex:none}
.badge .bw{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.badge .bw small{font-size:.55em;color:#7a6fb0}

/* ---- fx ---- */
#fx{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.confetti{position:absolute;top:-20px;width:12px;height:18px;border-radius:3px;animation:fall 1.9s cubic-bezier(.3,.6,.6,1) forwards}
.flystar{position:absolute;width:56px;height:56px;animation:flystar .9s ease-in forwards}
.burst{position:absolute;width:12px;height:12px;border-radius:50%;animation:burst .7s ease-out forwards}

@keyframes fall{to{transform:translate(var(--dx,0),105vh) rotate(var(--rot,540deg));opacity:.9}}
@keyframes flystar{0%{transform:scale(.4)}30%{transform:scale(1.4)}100%{transform:translate(var(--tx),var(--ty)) scale(.4);opacity:.6}}
@keyframes burst{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
@keyframes bump{0%,100%{transform:scale(1)}40%{transform:scale(1.25)}}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-10px) rotate(2deg)}}
@keyframes badgeBounce{from{margin-bottom:0}to{margin-bottom:12px}}
@keyframes wiggle{0%,100%{transform:rotate(0)}20%{transform:rotate(-12deg)}40%{transform:rotate(10deg)}60%{transform:rotate(-8deg)}80%{transform:rotate(6deg)}}
@keyframes dance{0%{transform:translateY(0) scale(1)}20%{transform:translateY(-22px) scale(1.08,.95) rotate(-8deg)}40%{transform:translateY(0) scale(1.1,.9)}60%{transform:translateY(-14px) rotate(8deg)}80%{transform:translateY(0) scale(.95,1.05)}100%{transform:none}}
@keyframes pop{0%{transform:scale(.2);opacity:0}70%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 4px #fff,0 0 0 9px rgba(255,210,63,.9)}50%{box-shadow:0 0 0 4px #fff,0 0 0 15px rgba(255,210,63,.35)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes drift{0%,100%{transform:translate(0,0)}25%{transform:translate(6px,-12px)}50%{transform:translate(-4px,-20px)}75%{transform:translate(-8px,-8px)}}

@media (max-width:1020px){
  .pill{padding:6px;justify-content:center}
  .pill .nm{display:none}
}
@media (max-width:640px){
  #topbar{flex-wrap:wrap;gap:8px;padding:8px 10px}
  #langbar{order:5;flex-basis:100%;gap:6px}
  #starCount{margin-left:auto}
  .pill{padding:4px 8px 4px 4px;font-size:13px;gap:4px;flex:1;justify-content:center;min-width:0}
  .pill .glyph{width:48px;height:48px;font-size:26px}
  .pill .nm{display:none}
  #screen{padding:12px 10px 30px}
}

@media (max-height:500px) and (orientation:landscape){
  #topbar{padding:6px 10px}
  .mode-btn{min-height:130px}
  .mode-btn svg{width:84px}
  .home-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
  .hello .big{font-size:28px}
  .badge{font-size:20px;padding:6px 18px 6px 8px;bottom:10px}
  .badge svg{width:36px;height:36px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  .confetti,.burst{display:none}
}

/* ===== Little Phonics World — game modes ===== */

/* ---- Letter & Sound Factory ---- */
.factory{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,36%);gap:18px;align-items:start}
.letter-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:14px}
.lcard{
  position:relative;aspect-ratio:1/1.08;min-height:var(--tap);border-radius:28px;background:var(--c,#ff7eb6);
  box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;
  transition:transform .15s;
}
.lcard:active{transform:scale(.94)}
.lcard .face{display:flex;gap:6px;align-items:flex-start;margin-bottom:2px}
.lcard .eye{width:18px;height:20px;background:#fff;border-radius:50%;position:relative;animation:blink 4s infinite;transform-origin:center}
.lcard .eye::after{content:"";position:absolute;width:9px;height:10px;border-radius:50%;background:#2b2350;left:5px;top:6px}
.lcard:nth-child(3n) .eye{animation-delay:-1.3s}.lcard:nth-child(3n+1) .eye{animation-delay:-2.6s}
.lcard .ch{font-size:clamp(46px,6vw,62px);font-weight:900;line-height:1;text-shadow:0 4px 0 rgba(0,0,0,.18)}
.lcard .mouth{width:16px;height:8px;border-radius:0 0 16px 16px;background:#fff;opacity:.95;margin-top:16px}
.lcard .horn{position:absolute;top:-8px;width:16px;height:22px;background:var(--yellow);border-radius:50% 50% 30% 30%;box-shadow:0 2px 0 rgba(0,0,0,.12)}
.lcard .horn.l{left:20%;transform:rotate(-18deg)}.lcard .horn.r{right:20%;transform:rotate(18deg)}
.lcard.dance{animation:dance .9s ease-in-out}
.lcard.seen::before{content:"";position:absolute;right:8px;bottom:8px;width:16px;height:16px;border-radius:50%;background:var(--yellow);box-shadow:0 0 0 3px #fff}
.spot{
  position:sticky;top:96px;background:#fff;border-radius:34px;box-shadow:var(--shadow);padding:18px;text-align:center;
  min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
}
.spot .pic{width:min(220px,60vw);height:auto;animation:pop .55s cubic-bezier(.3,1.5,.5,1)}
.spot .bigch{font-size:clamp(64px,9vw,96px);font-weight:900;line-height:1;color:var(--c,#9b5de5);text-shadow:0 5px 0 rgba(43,35,80,.12)}
.spot .word{font-size:clamp(30px,4.4vw,46px);font-weight:900;line-height:1.25}
.spot .syl{font-size:24px;font-weight:900;color:#ff5a8a;letter-spacing:2px}
.spot .hint{width:120px;opacity:.9;animation:bob 2s ease-in-out infinite}
.row{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}

/* ---- Word Builder Monsters ---- */
.builder{display:flex;flex-direction:column;align-items:center;gap:16px}
.target{display:flex;align-items:center;gap:16px;justify-content:center;flex-wrap:wrap}
.target .pic{width:clamp(130px,22vw,200px);height:auto;background:#fff;border-radius:30px;box-shadow:var(--shadow);padding:10px}
.target .pic.win{animation:dance 1s ease-in-out 2}
.slots{display:flex;gap:clamp(8px,1.6vw,16px);justify-content:center;padding:14px;border-radius:30px;background:rgba(255,255,255,.6)}
.slot{
  width:clamp(70px,13vw,108px);height:clamp(80px,14vw,118px);border-radius:24px;border:5px dashed #b9b0e6;
  display:grid;place-items:center;font-size:clamp(38px,6.4vw,62px);font-weight:900;color:rgba(43,35,80,.16);background:#fff;
}
.slot.next{border-color:var(--yellow);animation:glow 1.3s ease-in-out infinite}
.slot.filled{border-style:solid;border-color:transparent;color:#fff;background:var(--c,#4d96ff);animation:pop .4s}
.slot.hover{transform:scale(1.08);border-color:var(--green)}
.tray{display:flex;flex-wrap:wrap;gap:clamp(10px,2vw,20px);justify-content:center;min-height:120px;padding:8px}
.tile{
  position:relative;width:clamp(76px,13vw,104px);height:clamp(86px,14vw,114px);border-radius:26px;background:var(--c,#ff9f1c);
  color:#fff;font-size:clamp(36px,6vw,58px);font-weight:900;box-shadow:var(--shadow);display:grid;place-items:center;
  touch-action:none;animation:bob 1.6s ease-in-out infinite;text-shadow:0 3px 0 rgba(0,0,0,.18);
}
.tile:nth-child(2n){animation-delay:-.5s}.tile:nth-child(3n){animation-delay:-1s}
.tile .ant{position:absolute;top:-16px;width:6px;height:18px;background:var(--c,#ff9f1c);border-radius:4px}
.tile .ant::after{content:"";position:absolute;top:-8px;left:-5px;width:16px;height:16px;border-radius:50%;background:var(--yellow)}
.tile .ant.l{left:26%;transform:rotate(-14deg)}.tile .ant.r{right:26%;transform:rotate(14deg)}
.tile .te{position:absolute;bottom:8px;display:flex;gap:16px}
.tile .te i{width:9px;height:9px;border-radius:50%;background:#fff;display:block}
.tile .tch{margin-top:-14px}
.tile.drag{animation:none;z-index:50;transform:scale(1.15);box-shadow:0 18px 30px rgba(43,35,80,.3)}
.tile.no{animation:wiggle .5s}
.tile.used{visibility:hidden}
.th .tile,.th .slot{font-size:clamp(28px,4.6vw,44px);width:clamp(84px,15vw,120px)}

/* ---- Listen & Pop ---- */
.listen{display:flex;flex-direction:column;align-items:center;gap:14px}
.ask{display:flex;align-items:center;gap:14px;background:#fff;border-radius:50px;padding:10px 24px 10px 10px;box-shadow:var(--shadow)}
.ask .say{font-size:clamp(26px,4vw,40px);font-weight:900}
.ask .roundbtn{box-shadow:none;animation:bob 1.8s infinite}
.bubbles{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));gap:clamp(10px,3vw,30px);width:100%;max-width:980px;padding:10px}
.bubble{
  position:relative;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;min-width:var(--tap);
  background:radial-gradient(circle at 30% 28%,rgba(255,255,255,.95) 0 9%,rgba(255,255,255,.35) 10% 30%,rgba(190,230,255,.45) 60%,rgba(120,190,255,.6) 100%);
  box-shadow:inset 0 0 0 4px rgba(255,255,255,.85),0 10px 24px rgba(43,35,80,.15);animation:drift 6s ease-in-out infinite;
}
.bubble:nth-child(2){animation-delay:-1.5s}.bubble:nth-child(3){animation-delay:-3s}.bubble:nth-child(4){animation-delay:-4.5s}
.bubble svg{width:68%;height:68%}
.bubble.no{animation:wiggle .6s}
.bubble.hint{box-shadow:inset 0 0 0 4px #fff,0 0 0 10px var(--yellow),0 10px 24px rgba(43,35,80,.15)}
.bubble.popped{animation:pop .2s reverse forwards;pointer-events:none}
.bubble .cap{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);white-space:nowrap}
.giggle{position:absolute;top:-10px;right:-6px;font-size:30px;font-weight:900;color:#ff5a8a;animation:pop .4s}

/* ---- Rainbow Sound Stage ---- */
.tabs{display:flex;gap:12px;justify-content:center;margin-bottom:16px;flex-wrap:wrap}
.tab{min-width:96px;min-height:var(--tap);border-radius:24px;background:#fff;box-shadow:var(--shadow);display:flex;align-items:center;gap:8px;padding:6px 16px;font-weight:900;font-size:18px}
.tab svg{width:46px;height:46px}
.tab.on{background:var(--yellow);transform:translateY(-3px)}
.xylo{display:flex;align-items:center;height:clamp(190px,48vh,340px);justify-content:center;gap:clamp(4px,1vw,12px);padding:16px 8px;background:rgba(255,255,255,.55);border-radius:34px}
.bar{
  flex:1;height:var(--h,100%);max-width:92px;min-width:28px;border-radius:20px;background:var(--c);box-shadow:var(--shadow);
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:12px 0;color:#fff;
  font-weight:900;font-size:clamp(20px,3.4vw,36px);transition:transform .1s;text-shadow:0 2px 0 rgba(0,0,0,.2);
}
.bar i{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.75);display:block}
.bar.hit{transform:scale(.94) translateY(6px);filter:brightness(1.2)}
.bar small{font-size:.6em;opacity:.95}
.stage-out{min-height:84px;text-align:center;margin-top:14px}
.stage-out .w{font-size:clamp(28px,4.4vw,44px);font-weight:900;display:inline-block;animation:pop .4s}
.dots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:6px}
.dots svg{width:30px;height:30px;animation:pop .3s backwards}
.swatches,.zoo{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:16px}
.swatch{aspect-ratio:1;border-radius:50% 50% 46% 54%;background:var(--c);box-shadow:var(--shadow);display:grid;place-items:center;transition:transform .15s}
.swatch svg{width:60%;height:60%}
.zoo button{aspect-ratio:1;background:#fff;border-radius:30px;box-shadow:var(--shadow);padding:10px;display:grid;place-items:center}
.zoo button svg{width:90%;height:90%}
.swatch.dance,.zoo button.dance{animation:dance .8s}

/* ---- Sticker Book ---- */
.book{display:grid;grid-template-columns:minmax(220px,32%) minmax(0,1fr);gap:20px;align-items:start}
.jar{background:#fff;border-radius:34px;box-shadow:var(--shadow);padding:16px;text-align:center}
.jar svg{width:100%;max-width:260px;margin:0 auto}
.jar .n{font-size:42px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:6px}
.jar .n svg{width:44px;margin:0}
.stickers{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.stk{aspect-ratio:1;border-radius:26px;background:#fff;box-shadow:var(--shadow);display:grid;place-items:center;padding:8px;position:relative}
.stk svg{width:88%;height:88%}
.stk.locked svg{filter:grayscale(1) brightness(1.4);opacity:.35}
.stk.locked::after{content:"?";position:absolute;font-size:44px;font-weight:900;color:#c9c2ee}
.stk:not(.locked){animation:pop .5s backwards}
.stk .lg{position:absolute;top:6px;left:8px;font-weight:900;font-size:18px;color:#fff;background:var(--c);border-radius:12px;padding:0 7px}
.stk-head{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:8px}
.stk-head div{display:grid;place-items:center}
.stk-head svg{width:52px;height:52px}

/* ---- responsive ---- */
@media (max-width:900px){
  .factory{grid-template-columns:1fr}
  .spot{position:relative;top:0;min-height:0;order:-1}
  .spot .pic{width:min(170px,44vw)}
  .book{grid-template-columns:1fr}
}
@media (max-width:640px){
  .letter-grid{grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:10px}
  .lcard{border-radius:22px}

  }
})();

/* ---- mode-bubbles.js ---- */
/* Mode 3 — Listen & Pop Bubble Hunt: hear a word, pop the matching picture bubble. No timers, no lives. */
(function () {
  var C = window.LPWCore;
  var last = {};

  function pool(D) {
    var seen = {}, out = [];
    D.animals.concat(D.letters.map(function (L) { return { w: L.word, tr: L.tr, en: L.en, pic: L.pic }; })).forEach(function (it) {
      if (!seen[it.pic]) { seen[it.pic] = 1; out.push(it); }
    });
    return out;
  }

  MODES.bubbles = {
    title: 'Listen & Pop Bubble Hunt',
    render: function (root, D) {
      var la = window.LPWla(D), P = pool(D), target, opts, wrong = 0, solved = false;
      do { target = P[Math.floor(Math.random() * P.length)]; } while (P.length > 1 && target.pic === last[D.code]);
      last[D.code] = target.pic;
      opts = C.shuffle([target].concat(C.shuffle(P.filter(function (p) { return p.pic !== target.pic; })).slice(0, 3)));

      root.innerHTML = '<div class="screen-title"><span class="ico">' + ICON.mBubbles + '</span><h1>' + this.title + '</h1></div>';
      var box = C.el('div', { class: 'listen', id: 'listen' });
      box.innerHTML =
        '<div class="ask"><button class="roundbtn speak" id="hear" aria-label="Hear the word">' + ICON.speaker + '</button>' +
        '<div><div class="say" ' + la + '>' + C.esc(target.w) + '</div><div style="font-weight:800;color:#7a6fb0;font-size:18px">' + C.esc(target.tr) + '</div></div></div>' +
        '<div class="ptxt parent" style="text-align:center">Find: <b>' + C.esc(target.en) + '</b>. Wrong taps just giggle — after two, the right bubble glows.</div>' +
        '<div class="bubbles" id="bubbleBox" style="--n:' + opts.length + '"></div>';
      root.appendChild(box);
      var bb = box.querySelector('#bubbleBox');
      opts.forEach(function (o) {
        var b = C.el('button', { class: 'bubble', 'data-pic': o.pic, 'aria-label': o.en }, pic(o.pic, '') +
          '<span class="cap parent ptxt" ' + la + '>' + C.esc(o.w) + '</span>');
        if (o === target) b.setAttribute('data-ok', '1');
        b.addEventListener('click', function () { choose(b, o); });
        bb.appendChild(b);
      });
      function sayTarget() { C.say([{ text: target.w, tr: target.tr }]); }
      box.querySelector('#hear').addEventListener('click', sayTarget);
      setTimeout(function () { if (document.body.contains(box)) sayTarget(); }, 400);

      function choose(b, o) {
        if (solved) return;
        if (o === target) {
          solved = true;
          try { SFX.pop(); } catch (e) { /* ignore */ }
          var c = C.center(b); C.burst(c.x, c.y);
          C.addStar(b);
          b.classList.add('popped');
          C.confetti(50);
          C.say([{ text: target.w, tr: target.tr }], { quiet: true });
          C.progress('bubbles');
          box.setAttribute('data-solved', '1');
          setTimeout(function () {
            if (document.body.contains(box)) window.LPWApp.go('bubbles');
          }, 1700);
          return;
        }
        wrong++;
        try { SFX.giggle(); } catch (e) { /* ignore */ }
        C.restart(b, 'no');
        var g = C.el('span', { class: 'giggle' }, '♪'); b.appendChild(g);
        setTimeout(function () { g.remove(); }, 700);
        if (wrong >= 2) {
          var ok = bb.querySelector('[data-ok]');
          setTimeout(function () {
            sayTarget();
            if (ok) { ok.classList.add('hint'); setTimeout(function () { ok.classList.remove('hint'); }, 2200); }
          }, 500);
        }
      }
    }
  };
})();

/* ---- mode-stage.js ---- */
/* Mode 4 — Rainbow Sound Stage (free play) + Sticker Book / Star Jar. */
(function () {
  var C = window.LPWCore;
  var RAINBOW = ['#ff4d4d', '#ff7a1c', '#ff9f1c', '#ffd23f', '#a8e05f', '#3ddc84', '#2ec4b6', '#4d96ff', '#7b6cff', '#c86bff'];
  var tabNow = 'numbers';

  MODES.stage = {
    title: 'Rainbow Sound Stage',
    render: function (root, D) {
      var la = window.LPWla(D);
      root.innerHTML = '<div class="screen-title"><span class="ico">' + ICON.mStage + '</span><h1>' + this.title + '</h1></div>';
      var tabs = C.el('div', { class: 'tabs', role: 'tablist' });
      [['numbers', ICON.note, '1-10'], ['colors', ICON.palette, ''], ['animals', ICON.paw, '']].forEach(function (t) {
        var b = C.el('button', { class: 'tab' + (tabNow === t[0] ? ' on' : ''), 'data-tab': t[0], role: 'tab', 'aria-label': t[0], 'aria-selected': String(tabNow === t[0]) },
          t[1] + (t[2] ? '<span>' + t[2] + '</span>' : ''));
        b.addEventListener('click', function () { tabNow = t[0]; try { SFX.tap(); } catch (e) { /* ignore */ } MODES.stage.render(root, D); });
        tabs.appendChild(b);
      });
      root.appendChild(tabs);
      var area = C.el('div', { id: 'stageArea' }), out = C.el('div', { class: 'stage-out', id: 'stageOut' });

      function show(word, tr, en, extra) {
        out.innerHTML = '<div class="w" ' + la + '>' + C.esc(word) + '</div>' + (extra || '') +
          '<div class="ptxt parent" style="display:inline-block">' + C.esc(tr) + (en ? ' — “' + C.esc(en) + '”' : '') + '</div>';
        if (document.body.classList.contains('parent-on')) out.querySelector('.parent').style.display = 'inline-block';
      }
      function count() { C.progress('stage'); var s = C.ST.prog[D.code].stage; if (s % 10 === 0) C.addStar(out); }

      if (tabNow === 'numbers') {
        var x = C.el('div', { class: 'xylo', id: 'xylo' });
        D.numbers.forEach(function (n, i) {
          var b = C.el('button', { class: 'bar', 'data-n': i + 1, style: '--c:' + RAINBOW[i] + ';--h:' + (100 - i * 5.5) + '%;--hp:' + (150 - i * 7) + 'px', 'aria-label': String(i + 1) },
            '<i></i><span>' + (i + 1) + (D.digits ? '<br><small>' + D.digits[i] + '</small>' : '') + '</span><i></i>');
          b.addEventListener('pointerdown', function () { C.restart(b, 'hit'); });
          b.addEventListener('click', function () {
            try { SFX.xylo(i); } catch (e) { /* ignore */ }
            C.restart(b, 'hit');
            setTimeout(function () { b.classList.remove('hit'); }, 160);
            C.say([{ text: n.w, tr: n.tr }], { quiet: true });
            var dots = '<div class="dots">';
            for (var k = 0; k <= i; k++) dots += '<span style="animation-delay:' + (k * 0.05) + 's;display:block">' + ICON.star + '</span>';
            show((D.digits ? D.digits[i] + ' · ' : (i + 1) + ' · ') + n.w, n.tr, String(i + 1), dots + '</div>');
            count();
          });
          x.appendChild(b);
        });
        area.appendChild(x);
      } else if (tabNow === 'colors') {
        var sw = C.el('div', { class: 'swatches' });
        D.colors.forEach(function (c, i) {
          var b = C.el('button', { class: 'swatch', style: '--c:' + c.hex, 'aria-label': c.en }, svg(ART._h.face(50, 44, 12)));
          b.addEventListener('click', function () {
            try { SFX.xylo(i + 2); } catch (e) { /* ignore */ }
            C.restart(b, 'dance');
            C.say([{ text: c.w, tr: c.tr }], { quiet: true });
            show(c.w, c.tr, c.en);
            out.querySelector('.w').style.color = c.hex;
            count();
          });
          sw.appendChild(b);
        });
        area.appendChild(sw);
      } else {
        var zoo = C.el('div', { class: 'zoo' });
        D.animals.forEach(function (a) {
          var b = C.el('button', { 'aria-label': a.en, 'data-pic': a.pic }, pic(a.pic, ''));
          b.addEventListener('click', function () {
            try { SFX.animal(); } catch (e) { /* ignore */ }
            C.restart(b, 'dance');
            C.say([{ text: a.w, tr: a.tr }], { quiet: true });
            show(a.w, a.tr, a.en);
            count();
          });
          zoo.appendChild(b);
        });
        area.appendChild(zoo);
      }
      root.appendChild(area); root.appendChild(out);
    }
  };

  MODES.stickers = {
    title: 'Sticker Book & Star Jar',
    render: function (root) {
      var ST = C.ST;
      root.innerHTML = '<div class="screen-title"><span class="ico">' + ICON.book + '</span><h1>' + this.title + '</h1></div>';
      var book = C.el('div', { class: 'book' });
      var jar = C.el('div', { class: 'jar', id: 'jar' }, ICON.jar(ST.stars) + '<div class="n">' + ICON.star + '<span>' + ST.stars + '</span></div>');
      var right = C.el('div');
      var head = '<div class="stk-head">' + C.MODES_LIST.map(function (m) { return '<div>' + ICON.modeIcon[m] + '</div>'; }).join('') + '</div>';
      var grid = '<div class="stickers" id="stickerGrid">';
      ['he', 'el', 'th', 'es'].forEach(function (L) {
        var D = LPW_DATA[L];
        C.MODES_LIST.forEach(function (m, j) {
          var got = !!ST.stickers[L + '-' + m];
          grid += '<div class="stk' + (got ? '' : ' locked') + '" data-id="' + L + '-' + m + '" style="--c:' + D.color + ';animation-delay:' + (j * 0.06) + 's">' +
            ICON.sticker(L, m) + '<span class="lg" lang="' + L + '"' + (D.dir === 'rtl' ? ' dir="rtl"' : '') + '>' + D.glyph + '</span></div>';
        });
      });
      grid += '</div>';
      right.innerHTML = head + grid +
        '<div class="ptxt parent" style="margin-top:12px">Stickers unlock per language: Letters — tap ' + C.NEED.letters + ' different letters · Word Builder — finish ' +
        C.NEED.builder + ' word · Bubble Hunt — pop ' + C.NEED.bubbles + ' right bubbles · Sound Stage — play ' + C.NEED.stage + ' notes. Progress is saved on this device.</div>';
      book.appendChild(jar); book.appendChild(right);
      root.appendChild(book);
      root.querySelectorAll('.stk:not(.locked)').forEach(function (s) {
        s.addEventListener('click', function () { try { SFX.chime(); } catch (e) { /* ignore */ } C.restart(s, 'dance'); });
      });
    }
  };
})();

/* ---- app.js ---- */
/* App shell: top bar, language switcher, parent toggle, home screen, navigation, test hook. */
(function () {
  var C = window.LPWCore, ST = C.ST;
  var LANGS = ['he', 'el', 'th', 'es'];
  var screen = document.getElementById('screen');
  var mode = 'home';

  function renderLangbar() {
    var bar = document.getElementById('langbar');
    bar.innerHTML = '';
    LANGS.forEach(function (code) {
      var D = LPW_DATA[code];
      var b = C.el('button', {
        class: 'pill' + (ST.lang === code ? ' on' : ''), 'data-lang': code, style: '--c:' + D.color,
        'aria-label': D.en + ' — ' + D.name, 'aria-pressed': String(ST.lang === code), title: D.en
      }, '<span class="glyph" style="background:' + D.color + '" lang="' + code + '"' + (D.dir === 'rtl' ? ' dir="rtl"' : '') + '>' + D.glyph + '</span>' +
        '<span class="nm" lang="' + code + '"' + (D.dir === 'rtl' ? ' dir="rtl"' : '') + '>' + D.name + '</span>');
      b.addEventListener('click', function () { setLang(code, true); });
      bar.appendChild(b);
    });
  }

  function setLang(code, greet) {
    if (!LPW_DATA[code]) return false;
    ST.lang = code; C.save();
    document.documentElement.setAttribute('data-lang', code);
    renderLangbar();
    go(mode === 'stickers' ? 'stickers' : mode);
    if (greet) {
      try { SFX.chime(); } catch (e) { /* ignore */ }
      var D = LPW_DATA[code];
      C.say([{ text: D.hello, tr: D.helloTr }], { quiet: true });
    }
    return true;
  }

  function setParent(on) {
    ST.parent = !!on; C.save();
    document.body.classList.toggle('parent-on', ST.parent);
    document.getElementById('parentBtn').setAttribute('aria-pressed', String(ST.parent));
  }

  function renderHome(root) {
    var D = C.D();
    root.innerHTML =
      '<div class="hello"><div class="big" lang="' + D.code + '" dir="' + D.dir + '">' + C.esc(D.hello) + '</div>' +
      '<div class="ptxt parent" style="display:inline-block">' + C.esc(D.helloTr) + ' = “hello” in ' + D.en + '. Pick a game — every button is a picture, no reading needed.</div></div>';
    var grid = C.el('div', { class: 'home-grid' });
    [['letters', 'm-letters'], ['builder', 'm-builder'], ['bubbles', 'm-bubbles'], ['stage', 'm-stage']].forEach(function (m) {
      var b = C.el('button', { class: 'mode-btn ' + m[1], 'data-mode': m[0], 'aria-label': MODES[m[0]].title },
        ICON.modeIcon[m[0]] + '<span class="lbl">' + MODES[m[0]].title + '</span>');
      b.addEventListener('click', function () { try { SFX.tap(); } catch (e) { /* ignore */ } go(m[0]); });
      grid.appendChild(b);
    });
    root.appendChild(grid);
    var sb = C.el('button', { class: 'sticker-btn', 'data-mode': 'stickers', 'aria-label': 'Sticker Book' }, ICON.book + '<span>Sticker Book</span>' + ICON.jar(ST.stars).replace('<svg', '<svg style="width:46px;height:74px"'));
    sb.addEventListener('click', function () { try { SFX.tap(); } catch (e) { /* ignore */ } go('stickers'); });
    root.appendChild(sb);
  }

  function go(name) {
    if (name !== 'home' && !MODES[name]) name = 'home';
    mode = name;
    try { if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch (e) { /* ignore */ }
    screen.innerHTML = '';
    screen.setAttribute('data-mode', name);
    try {
      if (name === 'home') renderHome(screen);
      else MODES[name].render(screen, C.D());
    } catch (e) {
      screen.innerHTML = '';
      if (window.console) console.warn('render failed', e);
      renderHome(screen); mode = 'home';
    }
    window.scrollTo(0, 0);
    return mode;
  }

  /* Boot */
  document.getElementById('homeBtn').innerHTML = ICON.home;
  document.getElementById('homeBtn').addEventListener('click', function () { try { SFX.tap(); } catch (e) { /* ignore */ } go('home'); });
  document.getElementById('parentBtn').innerHTML = ICON.parent;
  document.getElementById('parentBtn').addEventListener('click', function () { setParent(!ST.parent); try { SFX.tap(); } catch (e) { /* ignore */ } });
  if (!LPW_DATA[ST.lang]) ST.lang = 'he';
  setParent(ST.parent);
  C.renderStars();
  renderLangbar();
  document.documentElement.setAttribute('data-lang', ST.lang);
  go('home');

  window.LPWApp = { go: go, setLang: setLang };
  /* Small, harmless hook for automated tests. */
  window.LPW = {
    setLang: function (c) { return setLang(c, false); },
    goMode: go,
    setParent: setParent,
    state: function () {
      return { lang: ST.lang, mode: mode, stars: ST.stars, parent: ST.parent, stickers: Object.keys(ST.stickers),
        voice: SPEECH.voiceName(ST.lang) || null };
    },
    langs: LANGS.slice(),
    modes: ['home', 'letters', 'builder', 'bubbles', 'stage', 'stickers']
  };
})();

</script>
